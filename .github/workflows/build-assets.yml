name: Build product cutouts

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cutouts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "rembg[cpu]" pillow
      - run: python tools/make_cutouts.py
      - name: Save to repo
        run: |
          git config user.name insta-autopost-bot
          git config user.email insta-autopost-bot@users.noreply.github.com
          git add assets
          git commit -m "Product cutouts" || echo "no change"
          git push
